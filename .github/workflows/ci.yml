name: CI

on:
  # Every branch gets the full check run. Tag pushes are ignored: the release
  # job creates those itself, and re-running on them would loop.
  push:
    branches: ["**"]
  pull_request:

# A new push to a branch makes the previous run's answer irrelevant — except on
# main, where cancelling could interrupt a release that is already publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default; only the release job widens this.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Same-repo branches are covered by the push event, so only fork pull
    # requests need the pull_request one. Without this, every PR runs twice.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      # Scratchpad shells out to git for its safety checks, so the tests need a
      # usable identity on every runner.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

      # install.ps1 and the PowerShell wrappers cannot run on the other
      # runners, so this is the only place they are ever executed.
      - name: PowerShell integration
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          go build -o sp.exe ./cmd/scratchpad
          .\sp.exe shell-init powershell | Out-String | Invoke-Expression
          foreach ($fn in 'spo', 'spn') {
            if (-not (Get-Command $fn -CommandType Function -ErrorAction SilentlyContinue)) {
              Write-Error "shell-init powershell did not define $fn"
              exit 1
            }
          }
          .\sp.exe completion powershell | Out-String | Invoke-Expression

  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d internal cmd
            exit 1
          fi

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: latest

      # A release config that only breaks at tag time breaks the release.
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: check

  build:
    name: cross-compile
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/scratchpad

  release:
    name: release
    # Only a green main publishes, and only a push to it — never a pull request,
    # whose code has not been reviewed into main yet.
    needs: [test, lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    # Releases queue instead of racing: two of them publishing at once would
    # fight over the same tag, and a cancelled one leaves a half-made release.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # goreleaser builds the changelog from history, and the version comes
          # from the last tag, neither of which a shallow clone has.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          # Released binaries are built from a cold cache on purpose. A build
          # cache is a bag of compiled objects keyed by a hash the branch being
          # built controls; restoring one here would make it an untrusted input
          # to an artefact people download and run.
          cache: false

      - name: Decide the version
        id: version
        run: |
          tag="$(./scripts/next-version.sh)"
          if [ -z "$tag" ]; then
            echo "nothing to release since the last tag, skipping"
          else
            echo "releasing $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        if: steps.version.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Modules are resolved exactly as committed and checksum-verified; a
          # release must never silently pull a different dependency graph.
          GOFLAGS: -mod=readonly
          GOSUMDB: sum.golang.org
