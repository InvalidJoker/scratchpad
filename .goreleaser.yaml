# Release configuration for Scratchpad. Validate with `goreleaser check`.
version: 2

project_name: scratchpad

before:
  hooks:
    # Completions are generated at release time rather than committed, so they
    # can never drift from the command tree they describe.
    - mkdir -p completions
    - sh -c 'go run ./cmd/scratchpad completion bash > completions/sp.bash'
    - sh -c 'go run ./cmd/scratchpad completion zsh  > completions/sp.zsh'
    - sh -c 'go run ./cmd/scratchpad completion fish > completions/sp.fish'
    - sh -c 'go run ./cmd/scratchpad completion powershell > completions/sp.ps1'

builds:
  - id: sp
    main: ./cmd/scratchpad
    binary: sp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible archives: without this every build stamps "now".
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: sp
    ids: [sp]
    # scripts/install.sh builds this name from uname output; keep it stable.
    name_template: "sp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # Every archive carries every shell's completions: scripts/install.sh and
      # install.ps1 read them from here, and so can a packager.
      - completions/sp.*

checksum:
  name_template: checksums.txt

snapshot:
  # Releases are dated, so a snapshot is today's date rather than a bumped
  # version: there is no next version to guess at.
  version_template: '{{ .Now.Format "2006.01.02" }}-snapshot'

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"
      - "^ci"
      - Merge pull request
      - Merge branch

release:
  # The second release of a day is tagged v<date>-1, which semver reads as a
  # prerelease. `prerelease: auto` would therefore hide it from
  # /releases/latest, which scripts/install.sh follows to find the version.
  prerelease: false
  footer: |
    ## Install

    Linux and macOS:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/InvalidJoker/scratchpad/main/scripts/install.sh | sh
    ```

    Windows:

    ```powershell
    irm https://raw.githubusercontent.com/InvalidJoker/scratchpad/main/scripts/install.ps1 | iex
    ```
