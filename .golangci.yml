version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - errorlint
    - unconvert

  settings:
    errcheck:
      # Best-effort cleanup and terminal writes are checked where it matters;
      # forcing a check on every one of these adds noise, not safety.
      exclude-functions:
        - (io.Writer).Write
        - os.Remove
        - os.RemoveAll
        - os.Chmod

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
